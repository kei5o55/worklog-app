name: Frontend CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 1. パッケージの高速・厳密インストール
      - name: Install dependencies
        run: npm ci

      # 2. TypeScript の型チェック
      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      # 3. Next.js ESLint チェック
      - name: Lint (ESLint)
        run: npx eslint .

      # 4. Next.js 本番ビルド検証
      - name: Build check
        run: npm run build